<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Passrotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3efe6;
    --surface: #ffffff;
    --surface-2: #eae3d5;
    --ink: #211d1b;
    --muted: #766c62;
    --line: #ddd2c1;
    --accent: #c1440e;
    --accent-ink: #ffffff;
    --accent-soft: #f2d9cb;
    --done: #2f6e63;
    --done-soft: #d9e8e3;
    --gold: #b8860b;
    --shadow: rgba(33, 25, 18, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1815;
      --surface: #262220;
      --surface-2: #2f2a26;
      --ink: #f1ece4;
      --muted: #a69c90;
      --line: #3a332d;
      --accent: #e2622a;
      --accent-ink: #1b1815;
      --accent-soft: #4a2c1c;
      --done: #4fa98d;
      --done-soft: #203a33;
      --gold: #f0c65a;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1815;
    --surface: #262220;
    --surface-2: #2f2a26;
    --ink: #f1ece4;
    --muted: #a69c90;
    --line: #3a332d;
    --accent: #e2622a;
    --accent-ink: #1b1815;
    --accent-soft: #4a2c1c;
    --done: #4fa98d;
    --done-soft: #203a33;
    --gold: #f0c65a;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 0 20px;
    padding-block: 28px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  h1, h2, h3 { font-family: "Big Shoulders Display", "IBM Plex Sans", sans-serif; text-wrap: balance; margin: 0; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }

  header.top { margin-bottom: 28px; }
  header.top h1 { font-size: 34px; font-weight: 800; line-height: 1.05; }
  header.top p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
  }

  .hero {
    box-shadow: 0 10px 30px var(--shadow);
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .hero .eyebrow { color: var(--accent); }
  .hero h2 {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .hero .variant-tag {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .exercise-list { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 8px; }
  .exercise-list li {
    padding: 10px 14px;
    background: var(--surface-2);
    border-radius: 10px;
    font-size: 15px;
  }
  .exercise-list .ex-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .exercise-list .ex-name { flex: 1; }
  .exercise-list .muscle {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .info-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .info-btn:hover { color: var(--accent); border-color: var(--accent); }
  .info-btn[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ex-desc {
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  .ex-desc[hidden] { display: none; }

  button.primary {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 18px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:active { transform: scale(0.99); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.primary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .rotation {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .chip {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    position: relative;
    margin: 0;
  }
  button.chip {
    width: 100%;
    cursor: pointer;
    font: inherit;
  }
  button.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .chip .grp { display: block; font-size: 15px; margin-bottom: 2px; }
  .chip.current { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .chip.last { border-color: var(--gold); }
  .chip.last.panel-open { box-shadow: 0 0 0 2px var(--gold); }
  .chip.stamped { z-index: 1; }
  .chip.stamped:hover, .chip.stamped:focus-within { z-index: 3; }

  .chip-stamp {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 2;
  }
  .chip-stamp img {
    width: 130%;
    height: 130%;
    object-fit: contain;
    transform: rotate(-6deg);
    filter: drop-shadow(0 3px 5px var(--shadow));
  }

  .undo-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 26px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: 12px;
    font-size: 14px;
  }
  .undo-panel[hidden] { display: none; }
  .undo-panel .undo-info strong { display: block; font-size: 15px; }
  .undo-panel .undo-info span { color: var(--muted); font-size: 12.5px; }
  .undo-panel .undo-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .undo-panel button {
    border-radius: 8px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
  }
  .undo-panel button.confirm { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .undo-panel button:disabled { opacity: 0.6; cursor: default; }
  .undo-panel button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  section.stats { margin-top: 34px; }
  section.stats h3 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
  }

  .stat-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
  }
  .tile .num {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    color: var(--accent);
    display: block;
  }
  .tile .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .bars { display: grid; gap: 10px; margin-bottom: 24px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .name { color: var(--muted); }
  .bar-track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--done); border-radius: 6px; }
  .bar-row .count { font-family: "IBM Plex Mono", monospace; text-align: right; font-variant-numeric: tabular-nums; }

  .history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .history li {
    display: flex;
    justify-content: space-between;
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
  }
  .history .date { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  .status-line {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 30px;
  }

  .quest-stamp {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.16), transparent 65%);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.5s ease;
  }
  .quest-stamp.show { opacity: 1; transition: opacity 0.15s ease; }

  .quest-stamp .badge {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    outline: 1.5px solid var(--gold);
    outline-offset: -12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    background: color-mix(in srgb, var(--gold) 10%, transparent);
    box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
    transform: scale(2.6) rotate(-14deg);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.2, 1.6, 0.4, 1), opacity 0.2s ease, box-shadow 0.5s ease 0.15s;
  }
  .quest-stamp.show .badge {
    transform: scale(1) rotate(-8deg);
    opacity: 1;
    box-shadow: 0 0 34px 6px rgba(212, 175, 55, 0.45);
  }
  .quest-stamp .badge .rule {
    width: 68%;
    height: 2.5px;
    background: var(--gold);
    opacity: 0.7;
    margin: 7px 0;
  }
  .quest-stamp .badge .line1 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .quest-stamp .badge .line2 {
    font-family: "Big Shoulders Display", sans-serif;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
    margin-top: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .quest-stamp, .quest-stamp .badge { transition: opacity 0.3s ease; transform: none !important; }
  }

  @media (max-width: 480px) {
    .rotation { grid-template-columns: repeat(3, 1fr); }
    .stat-tiles { grid-template-columns: repeat(3, 1fr); }
    .bar-row { grid-template-columns: 90px 1fr 30px; }
    .quest-stamp .badge { width: 160px; height: 160px; }
    .quest-stamp .badge .line1 { font-size: 12px; }
    .quest-stamp .badge .line2 { font-size: 32px; }
    .quest-stamp .badge .rule { margin: 5px 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <p class="eyebrow">Hantlar &amp; bänk</p>
    <h1>Passrotation</h1>
    <p>Håll koll på vilket pass som är nästa, och se statistik över det du kört.</p>
  </header>

  <div class="card hero" id="hero">
    <p class="eyebrow" id="hero-eyebrow">Nästa pass</p>
    <h2 id="hero-title">Laddar…</h2>
    <span class="variant-tag" id="hero-variant"></span>
    <ul class="exercise-list" id="hero-exercises"></ul>
    <button class="primary" id="complete-btn" disabled>Markera som genomfört</button>

    <div class="quest-stamp" id="quest-stamp" aria-hidden="true">
      <div class="badge">
        <span class="rule"></span>
        <span class="line1">Pass</span>
        <span class="line2">Slutfört</span>
        <span class="rule"></span>
      </div>
    </div>
  </div>

  <div class="rotation" id="rotation"></div>

  <div class="undo-panel" id="undo-panel" hidden>
    <div class="undo-info">
      <strong id="undo-panel-title"></strong>
      <span id="undo-panel-date"></span>
    </div>
    <div class="undo-actions">
      <button type="button" id="undo-cancel-btn">Avbryt</button>
      <button type="button" class="confirm" id="undo-confirm-btn">Ångra passet</button>
    </div>
  </div>

  <section class="stats">
    <h3>Statistik</h3>
    <div class="stat-tiles" id="stat-tiles"></div>
    <div class="bars" id="bars"></div>
    <ul class="history" id="history"></ul>
  </section>

  <p class="status-line" id="status-line"></p>
</div>

    { id: "bt-a", group: "Biceps & Triceps", variant: "A", exercises: [
      { name: "Stående hantelcurl", muscle: "Biceps",
        desc: "Stå med hantlar längs sidorna, handflator framåt. Böj armbågarna och curla hantlarna upp mot axlarna utan att svinga med kroppen." },
      { name: "Hammercurl", muscle: "Biceps",
        desc: "Som hantelcurl men med handflatorna vända mot varandra genom hela rörelsen." },
      { name: "Triceps extension över huvudet", muscle: "Triceps",
        desc: "Håll en hantel med båda händerna rakt upp över huvudet. Sänk hanteln bakom huvudet genom att böja armbågarna, pressa tillbaka upp." },
      { name: "Triceps kickback", muscle: "Triceps",
        desc: "Luta överkroppen framåt, överarmen intill sidan och parallell med golvet. Sträck ut underarmen bakåt tills armen är helt rak, för tillbaka kontrollerat." },
    ]},
    { id: "br-b", group: "Ben & Rygg", variant: "B", exercises: [
      { name: "Reverse lunges med hantlar", muscle: "Ben",
        desc: "Håll hantlar längs sidorna, ta ett långt kliv bakåt och sänk tills bakre knäet nästan nuddar golvet och främre låret är nära parallellt med golvet. Pressa tillbaka till startläget och byt sida." },
      { name: "Hantellunges", muscle: "Ben",
        desc: "Håll hantlar längs sidorna, ta ett långt kliv framåt och sänk tills bakre knäet nästan nuddar golvet. Pressa tillbaka till startläget." },
      { name: "Enarmsrodd mot bänk", muscle: "Rygg",
        desc: "Stöd ena handen och samma sidas knä mot bänken, ryggen parallell med golvet. Dra hanteln upp mot höften med andra armen, sänk kontrollerat." },
      { name: "Hantelpullover på bänk", muscle: "Rygg",
        desc: "Ligg på rygg på bänken med en hantel hållen med båda händerna rakt ovanför bröstet. Sänk hanteln bakåt över huvudet i en bågrörelse, för tillbaka." },
    ]},
    { id: "ab-b", group: "Axel & Bröst", variant: "B", exercises: [
      { name: "Arnold press", muscle: "Axel",
        desc: "Börja med hantlarna framför axlarna, handflator mot dig. Pressa upp samtidigt som du roterar handlederna så handflatorna pekar framåt vid toppen." },
      { name: "Framåtlyft", muscle: "Axel",
        desc: "Stå med hantlar framför låren. Lyft en eller båda armarna rakt fram till axelhöjd, sänk kontrollerat." },
      { name: "Bänkpress, lutande bänk", muscle: "Bröst",
        desc: "Som bänkpress men på en bänk lutad ca 30–45°, vilket riktar mer belastning mot övre bröstet." },
      { name: "Flyes, lutande bänk", muscle: "Bröst",
        desc: "Som flyes men på lutande bänk, för övre bröstet." },
    ]},
    { id: "bt-b", group: "Biceps & Triceps", variant: "B", exercises: [
      { name: "Sittande hantelcurl på bänk", muscle: "Biceps",
        desc: "Sitt på bänken med rak rygg, curla hantlarna upp mot axlarna en arm i taget eller samtidigt." },
      { name: "Koncentrationscurl", muscle: "Biceps",
        desc: "Sitt på bänken, stöd armbågen mot insidan av låret. Curla hanteln upp mot axeln med fokus på biceps, sänk långsamt." },
      { name: "Dips mot bänk", muscle: "Triceps",
        desc: "Sitt på kanten av bänken med händerna bredvid höfterna, fötterna framför dig. Sänk kroppen genom att böja armbågarna, pressa upp igen." },
      { name: "Nedliggande triceps-press på bänk", muscle: "Triceps",
        desc: "Ligg på rygg med hantlar rakt upp över axlarna. Böj enbart armbågarna och sänk hantlarna mot huvudet, pressa upp igen." },
    ]},
  ];
  const ROTATION_ORDER = ["br-a", "ab-a", "bt-a", "br-b", "ab-b", "bt-b"];
  const byId = Object.fromEntries(TEMPLATES.map((t) => [t.id, t]));
  const GROUP_BASE = ["Ben & Rygg", "Axel & Bröst", "Biceps & Triceps"];

  const LOCAL_KEY = "gym-tracker-sessions-v1";
  let sessions = []; // {templateId, completedAt} newest first
  let mode = "loading"; // "db" | "local"
  let dbCol = null;

  const el = {
    heroTitle: document.getElementById("hero-title"),
    heroVariant: document.getElementById("hero-variant"),
    heroExercises: document.getElementById("hero-exercises"),
    completeBtn: document.getElementById("complete-btn"),
    rotation: document.getElementById("rotation"),
    statTiles: document.getElementById("stat-tiles"),
    bars: document.getElementById("bars"),
    history: document.getElementById("history"),
    statusLine: document.getElementById("status-line"),
    questStamp: document.getElementById("quest-stamp"),
    undoPanel: document.getElementById("undo-panel"),
    undoPanelTitle: document.getElementById("undo-panel-title"),
    undoPanelDate: document.getElementById("undo-panel-date"),
    undoCancelBtn: document.getElementById("undo-cancel-btn"),
    undoConfirmBtn: document.getElementById("undo-confirm-btn"),
  };

  let stampTimer = null;
  let showUndoPanel = false;
  let undoBusy = false;

  function genLocalId() {
    return "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }

  function toggleUndoPanel() {
    showUndoPanel = !showUndoPanel;
    render();
  }

  function closeUndoPanel() {
    showUndoPanel = false;
    render();
  }

  async function confirmUndo() {
    if (undoBusy || sessions.length === 0) return;
    const target = sessions[0];
    undoBusy = true;
    el.undoConfirmBtn.disabled = true;
    el.undoConfirmBtn.textContent = "Ångrar…";
    try {
      if (mode === "db" && dbCol && target.id) {
        await dbCol.doc(target.id).delete();
      } else {
        sessions = sessions.filter((s) => s.id !== target.id);
        saveLocal();
      }
    } catch (e) {}
    undoBusy = false;
    showUndoPanel = false;
    el.undoConfirmBtn.disabled = false;
    el.undoConfirmBtn.textContent = "Ångra passet";
    render();
  }

  function playFanfare() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;

      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const start = now + i * 0.09;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.3, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.55);
      });

      const chordStart = now + notes.length * 0.09 + 0.05;
      [1046.5, 1318.51, 1568.0].forEach((freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, chordStart);
        gain.gain.setValueAtTime(0, chordStart);
        gain.gain.linearRampToValueAtTime(0.2, chordStart + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, chordStart + 1.1);
        osc.connect(gain).connect(ctx.destination);
        osc.start(chordStart);
        osc.stop(chordStart + 1.2);
      });

      setTimeout(() => ctx.close(), 2200);
    } catch (e) {}
  }

  function celebrate() {
    playFanfare();
    const stamp = el.questStamp;
    stamp.classList.remove("show");
    void stamp.offsetWidth; // restart animation on repeat clicks
    stamp.classList.add("show");
    clearTimeout(stampTimer);
    stampTimer = setTimeout(() => stamp.classList.remove("show"), 1900);
  }

  function nextTemplateId() {
    if (sessions.length === 0) return ROTATION_ORDER[0];
    const lastId = sessions[0].templateId;
    const idx = ROTATION_ORDER.indexOf(lastId);
    if (idx === -1) return ROTATION_ORDER[0];
    return ROTATION_ORDER[(idx + 1) % ROTATION_ORDER.length];
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" }) +
      " " + d.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
  }

  function render() {
    const nextId = nextTemplateId();
    const next = byId[nextId];

    el.heroTitle.textContent = next.group;
    el.heroVariant.textContent = "Variant " + next.variant;
    el.heroExercises.innerHTML = "";
    next.exercises.forEach((ex, i) => {
      const li = document.createElement("li");

      const row = document.createElement("div");
      row.className = "ex-row";

      const name = document.createElement("span");
      name.className = "ex-name";
      name.textContent = ex.name;

      const infoBtn = document.createElement("button");
      infoBtn.type = "button";
      infoBtn.className = "info-btn";
      infoBtn.textContent = "?";
      infoBtn.setAttribute("aria-expanded", "false");
      infoBtn.setAttribute("aria-label", "Beskrivning: " + ex.name);

      const muscle = document.createElement("span");
      muscle.className = "muscle";
      muscle.textContent = ex.muscle;

      row.append(name, infoBtn, muscle);

      const desc = document.createElement("p");
      desc.className = "ex-desc";
      desc.id = "ex-desc-" + i;
      desc.textContent = ex.desc;
      desc.hidden = true;
      infoBtn.setAttribute("aria-controls", desc.id);

      infoBtn.addEventListener("click", () => {
        const isOpen = !desc.hidden;
        desc.hidden = isOpen;
        infoBtn.setAttribute("aria-expanded", String(!isOpen));
      });

      li.append(row, desc);
      el.heroExercises.appendChild(li);
    });
    el.completeBtn.disabled = mode === "loading";

    el.rotation.innerHTML = "";
    const lastSession = sessions.length ? sessions[0] : null;
    const lastId = lastSession ? lastSession.templateId : null;
    const completedIds = new Set(sessions.map((s) => s.templateId));
    ROTATION_ORDER.forEach((id) => {
      const t = byId[id];
      const isLast = id === lastId;
      const isCompleted = completedIds.has(id);
      const chip = document.createElement(isLast ? "button" : "div");
      if (isLast) chip.type = "button";
      chip.className = "chip";
      if (id === nextId) chip.classList.add("current");
      if (isLast) chip.classList.add("last");
      if (isLast && showUndoPanel) chip.classList.add("panel-open");
      chip.innerHTML = '<span class="grp">' + t.variant + "</span>" +
        t.group.split(" & ").map((w) => w.slice(0, 4)).join("/");
      if (isCompleted) {
        chip.classList.add("stamped");
        const stampWrap = document.createElement("span");
        stampWrap.className = "chip-stamp";
        const img = document.createElement("img");
        img.src = STAMP_ICON_SRC;
        img.alt = "Genomfört";
        stampWrap.appendChild(img);
        chip.appendChild(stampWrap);
      }
      if (isLast) {
        chip.setAttribute("aria-expanded", String(showUndoPanel));
        chip.setAttribute("aria-label", "Senast genomfört: " + t.group + " (" + t.variant + "). Klicka för att ångra.");
        chip.addEventListener("click", toggleUndoPanel);
      }
      el.rotation.appendChild(chip);
    });

    if (lastSession) {
      const t = byId[lastSession.templateId];
      el.undoPanelTitle.textContent = t ? t.group + " (" + t.variant + ")" : lastSession.templateId;
      el.undoPanelDate.textContent = fmtDate(lastSession.completedAt);
      el.undoPanel.hidden = !showUndoPanel;
    } else {
      el.undoPanel.hidden = true;
    }

    const total = sessions.length;
    const now = Date.now();
    const last7d = sessions.filter((s) => now - new Date(s.completedAt).getTime() < 7 * 86400000).length;
    const lastDate = total ? fmtDate(sessions[0].completedAt) : "—";

    el.statTiles.innerHTML = "";
    [
      { num: total, label: "Pass totalt" },
      { num: last7d, label: "Senaste 7 dagarna" },
      { num: lastDate, label: "Senast genomfört" },
    ].forEach((s) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.innerHTML = '<span class="num">' + s.num + '</span><span class="label">' + s.label + "</span>";
      el.statTiles.appendChild(tile);
    });

    const groupCounts = Object.fromEntries(GROUP_BASE.map((g) => [g, 0]));
    sessions.forEach((s) => {
      const t = byId[s.templateId];
      if (t) groupCounts[t.group] = (groupCounts[t.group] || 0) + 1;
    });
    const maxCount = Math.max(1, ...Object.values(groupCounts));
    el.bars.innerHTML = "";
    GROUP_BASE.forEach((g) => {
      const c = groupCounts[g] || 0;
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML =
        '<span class="name">' + g + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + (c / maxCount * 100) + '%"></span></span>' +
        '<span class="count">' + c + '</span>';
      el.bars.appendChild(row);
    });

    el.history.innerHTML = "";
    if (sessions.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.style.display = "block";
      li.textContent = "Inga pass loggade ännu.";
      el.history.appendChild(li);
    } else {
      sessions.slice(0, 10).forEach((s) => {
        const t = byId[s.templateId];
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = t ? t.group + " (" + t.variant + ")" : s.templateId;
        const date = document.createElement("span");
        date.className = "date";
        date.textContent = fmtDate(s.completedAt);
        li.append(name, date);
        el.history.appendChild(li);
      });
    }

    el.statusLine.textContent = mode === "db"
      ? "Synkas i molnet — samma logg på alla dina enheter."
      : mode === "local"
      ? "Sparas bara i den här webbläsaren (ingen molnsynk tillgänglig just nu)."
      : "Laddar…";
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      sessions = raw ? JSON.parse(raw) : [];
    } catch (e) {
      sessions = [];
    }
    sessions.forEach((s) => { if (!s.id) s.id = genLocalId(); });
    sessions.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
  }

  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(sessions));
    } catch (e) {}
  }

  async function completeSession() {
    const templateId = nextTemplateId();
    const completedAt = new Date().toISOString();
    el.completeBtn.disabled = true;
    el.completeBtn.textContent = "Sparar…";
    showUndoPanel = false;
    celebrate();

    if (mode === "db" && dbCol) {
      try {
        await dbCol.add({ templateId, completedAt });
      } catch (e) {
        sessions.unshift({ id: genLocalId(), templateId, completedAt });
        render();
      }
    } else {
      sessions.unshift({ id: genLocalId(), templateId, completedAt });
      saveLocal();
      render();
    }

    el.completeBtn.textContent = "Markera som genomfört";
    el.completeBtn.disabled = false;
  }

  el.completeBtn.addEventListener("click", completeSession);
  el.undoCancelBtn.addEventListener("click", closeUndoPanel);
  el.undoConfirmBtn.addEventListener("click", confirmUndo);

  async function init() {
    let db = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use("db");
      }
    } catch (e) {
      db = null;
    }

    if (db) {
      mode = "db";
      dbCol = db.collection("sessions");
      dbCol.orderBy("completedAt", "desc").limit(200).onSnapshot(
        (snap) => {
          sessions = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
          render();
        },
        () => {
          mode = "local";
          loadLocal();
          render();
        }
      );
      render();
    } else {
      mode = "local";
      loadLocal();
      render();
    }
  }

  init();
})();
</script>
</body>
</html>
